<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Слава и Денис — игра на двух устройствах</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#253454;background:#fdf5e6}*{box-sizing:border-box}body{margin:0;padding:20px 14px 60px}main{max-width:510px;margin:auto}.card{background:white;border-radius:26px;padding:20px;margin:15px 0;box-shadow:0 5px 20px #18345614}h1{text-align:center;font-size:27px}h2{font-size:23px}p{line-height:1.5}button,a.action{border:0;background:#2563eb;color:#fff;border-radius:16px;padding:15px 17px;font-size:17px;font-weight:700;width:100%;margin:6px 0;display:block;text-align:center;text-decoration:none;cursor:pointer}button.alt{background:#e88932}button.ghost{background:#eef2ff;color:#253454}button:disabled{opacity:.45}.hero{font-size:78px;text-align:center}.code{font-size:44px;font-weight:900;letter-spacing:8px;text-align:center;color:#275cbd}input,select{width:100%;font:inherit;font-size:19px;border:2px solid #d3daed;border-radius:16px;padding:13px;margin:6px 0}.sub{color:#556680;font-size:14px}.ok{background:#eaf8ed;border-radius:14px;padding:12px}.tag{color:#925315;font-weight:700}.hidden{display:none!important}#status{font-size:13px;text-align:center;color:#596b86}.link{word-break:break-word;font-size:13px} </style></head><body><main><p><a href="/" style="color:#2563eb;text-decoration:none">← Вернуться к приключениям</a></p><h1>✨ Приключения Славы и Дениса</h1><div id="app"></div><p id="status"></p></main><script>
const BASE='https://vllkrldomkbaivycrzzb.supabase.co/rest/v1/rpc/', KEY='sb_publishable_ebQeZFF9Y64aUzs4H-0NIw_z1bXEPV3';
const Q={robot:{name:'Бипик',icon:'🤖',theme:'Спасение робота',levels:[
['Запусти двигатель','Сделайте пять настоящих роботских шагов. После каждого скажите «Бип!»','Покажи детям медленные механические шаги. За каждый правильный шаг выдай заряд батареи.','Робот-зеркало: один показывает движения, второй повторяет, затем поменяйтесь.'],
['Почини датчики','Найдите красный, синий и жёлтый предметы!','Заранее разложи три цветных предмета по комнате. Попроси каждого найти хотя бы один.','Сканер цвета: называй цвет, дети дотрагиваются до предмета такого цвета.'],
['Включи счётчик','Найдите четыре игрушки и посчитайте их!','Разложи четыре игрушки. Соберите и сосчитайте их вместе.','Секретный код: два хлопка, притоп, руки вверх. Дети запоминают и повторяют.'],
['Роборуки и ноги','Три хлопка, два притопа, руки вверх, поворот!','Покажи последовательность, дети повторяют. Усложни темп при желании.','Замри, робот: команда «включён» — двигаться; «выключен» — замереть.'],
['Активируй сердце','Дайте друг другу пять! Обнимите игрушку и скажите: «Бипик, просыпайся!»','Попроси детей дать пять и обняться, затем отдай последнюю деталь пазла.','Обратный отсчёт: 5–4–3–2–1, на каждой цифре новое движение.']
]},pumpkin:{name:'Тыковка',icon:'🎃',theme:'Пять волшебных огоньков',levels:[
['Оранжевая магия','Найдите три оранжевых предмета!','Подготовь три предмета оранжевого цвета.','Волшебный фонарик: веди пятном света по полу — дети следуют за ним.'],
['Найди Тыковку','Тыковка спряталась! Найдите её!','Спрячь рисунок или игрушечную тыкву.','Горячо-холодно: говори «теплее» или «холоднее» в зависимости от направления.'],
['Загадки ночи','Что круглое, оранжевое, растёт на грядке? А что светит ночью?','Ответы: тыква и луна.','Театр теней: фонариком показывай тени рук на стене, пусть дети угадывают.'],
['Тропа волшебника','Пройдите по островкам через волшебное болото!','Разложи три подушки, сделай безопасную дорожку на полу.','Лазерный коридор: обойдите бумажные ленты между устойчивыми опорами.'],
['Верни огоньки','Скажите: «Тыква, тыква, раз-два-три, волшебство скорей верни!»','Произнесите пароль вместе и трижды хлопните.','Танец огоньков: танцуйте под музыку, при паузе замрите.']
]},snow:{name:'Снежок',icon:'⛄',theme:'Спасение подарка',levels:[
['Зимний цвет','Найдите три белых предмета!','Заранее подбери или предложи детям поискать белые вещи.','Снежный радар: белый предмет — один хлопок, другой цвет — два.'],
['Снежные кристаллы','Найдите пять потерянных снежинок!','Вырежи пять снежинок и напиши цифры от 1 до 5.','Ледяной порядок: разложить найденные снежинки по номерам.'],
['Зимний сыщик','Найдите три отличия у двух снеговиков!','Подготовь два рисунка: одна пуговица, цвет шарфа, звезда на шапке различаются.','Снежная память: покажи три игрушки, убери одну, дети угадывают.'],
['Танец снеговика','Два хлопка, поворот, три шага, руки вверх!','Повтори танец вместе с детьми.','Замороженные статуи: музыка остановилась — замираем.'],
['Спаси подарок','Скажите: «Снежок, Снежок, помоги, нам подарок покажи!»','После пароля выдай подсказку к тайнику с призом.','Охота за подарком: давай подсказки по комнате, мебели и месту приза.']
]}};
const app=document.querySelector('#app'), status=document.querySelector('#status');let mode='',room=null,secret='',timer=null,busy=false;
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function set(html){app.innerHTML=html}function note(t){status.textContent=t||''}
async function rpc(name,data){const r=await fetch(BASE+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(data)});let j=await r.json().catch(()=>null);if(!r.ok)throw Error(j?.message||'Ошибка соединения');return j}
function start(){clearInterval(timer);room=null;mode='';const saved=localStorage.getItem('sd_host_room');set('<div class="card"><div class="hero">👨‍👦‍👦</div><h2>Телефон ведущего</h2><p>Создай игру и управляй заданиями с телефона.</p><select id="choose"><option value="robot">🤖 Бипик</option><option value="pumpkin">🎃 Тыковка</option><option value="snow">⛄ Снежок</option></select><button id="create">Создать игру</button>'+(saved?'<button class="ghost" id="resume">Вернуться к своей игре</button>':'')+'</div><div class="card"><div class="hero">🎮</div><h2>Планшет детей</h2><p>Введи шестизначный код с телефона папы.</p><input id="joinCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Код комнаты"><button class="alt" id="join">Подключиться</button></div>');document.querySelector('#create').onclick=create;document.querySelector('#join').onclick=()=>join(document.querySelector('#joinCode').value);if(saved)document.querySelector('#resume').onclick=()=>{try{let v=JSON.parse(saved);host(v.code,v.secret)}catch(e){localStorage.removeItem('sd_host_room');start()}}}
async function create(){let b=document.querySelector('#create');b.disabled=true;note('Создаю комнату...');try{let v=await rpc('quest_room_create',{p_quest:document.querySelector('#choose').value});localStorage.setItem('sd_host_room',JSON.stringify({code:v.code,secret:v.secret}));host(v.code,v.secret)}catch(e){note('Не удалось создать комнату: '+e.message);b.disabled=false}}
async function join(code){code=String(code||'').trim();if(!/^\d{6}$/.test(code)){note('Введите 6 цифр кода');return}try{let v=await rpc('quest_room_get',{p_code:code});if(!v)throw Error('Комната не найдена или срок истёк');mode='child';room=v;render();poll()}catch(e){note(e.message)}}
async function host(code,s){try{let v=await rpc('quest_room_get',{p_code:code});if(!v)throw Error('Срок комнаты истёк');mode='host';room=v;secret=s;render();poll()}catch(e){localStorage.removeItem('sd_host_room');note(e.message);start()}}
function poll(){clearInterval(timer);timer=setInterval(async()=>{if(busy||!room)return;try{let v=await rpc('quest_room_get',{p_code:room.code});if(!v){clearInterval(timer);note('Комната завершена. Создайте новую игру.');return}if(v.stage!==room.stage||v.state!==room.state){room=v;render()}else note('● Устройства синхронизированы')}catch(e){note('Нет соединения. Повторяю...')}},2000)}
function render(){if(!room)return;const q=Q[room.quest],s=room.stage,done=s>=6;let body='<div class="card"><div class="hero">'+q.icon+'</div><h2>'+q.name+'</h2><p class="sub">'+q.theme+'</p><div class="code">'+esc(room.code)+'</div><p class="sub" style="text-align:center">Код комнаты · действует до 6 часов</p><p class="tag">'+(done?'🏆 Приключение завершено':'Уровень '+s+' из 5')+'</p>';if(done){body+='<h2>🎉 Победа!</h2><p>Слава и Денис выполнили все испытания. Время собрать награды и найти приз!</p>'}else{let l=q.levels[s-1];body+='<h2>'+esc(l[0])+'</h2><p>'+esc(l[1])+'</p>';if(mode==='host')body+='<div class="ok"><b>🎤 Для папы</b><p>'+esc(l[2])+'</p><b>🎲 Дополнительная игра</b><p>'+esc(l[3])+'</p></div>'}body+='</div>';if(mode==='host')body+='<div class="card"><h2>🎛️ Пульт ведущего</h2>'+(done?'<button class="ghost" id="restart">Начать уровни заново</button>':'<button id="next">✅ Задание выполнено — следующий уровень</button>')+'<button class="alt" id="invite">📲 Ссылка для планшета</button><button class="ghost" id="prev">← Предыдущий уровень</button><p class="sub">Только с этого устройства можно переключать этапы.</p></div>';else body+='<div class="card"><p>👀 Выполните задание и покажите результат папе. Он откроет следующий уровень.</p></div>';body+='<button class="ghost" id="exit">← На главный экран</button>';set(body);document.querySelector('#exit').onclick=start;if(mode==='host'){let b=document.querySelector(done?'#restart':'#next');document.querySelector('#invite').onclick=async()=>{let u=location.origin+'/room.html?join='+encodeURIComponent(room.code);try{await navigator.clipboard.writeText(u);note('Ссылка для планшета скопирована')}catch(e){prompt('Ссылка для планшета:',u)}};document.querySelector('#prev').onclick=async()=>{if(busy)return;busy=true;try{room=await rpc('quest_room_advance',{p_code:room.code,p_secret:secret,p_stage:Math.max(1,s-1)});render();note('Вернулись к предыдущему уровню')}catch(e){note(e.message)}finally{busy=false}};b.onclick=async()=>{if(busy)return;busy=true;b.disabled=true;note('Сохраняю результат...');try{room=await rpc('quest_room_advance',{p_code:room.code,p_secret:secret,p_stage:done?1:s+1});render();note('Уровень обновлён')}catch(e){note(e.message);b.disabled=false}finally{busy=false}}}}
let url=new URL(location.href);let c=url.searchParams.get('join');if(c)join(c);else start();
</script></body></html>
