<style>

*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;text-align:center}
#app{max-width:440px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:30px;margin:6px 0;line-height:1.1}
p{font-size:20px;line-height:1.35;margin:8px 0}
.btn{display:block;width:100%;max-width:360px;margin:12px auto;padding:20px;font:inherit;font-size:26px;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:28px;box-shadow:0 6px 0 rgba(0,0,0,.18)}

.btn.go{background:var(--ok)}.btn.alt{background:var(--orange)}
.btn.small{font-size:18px;padding:12px;background:transparent;color:var(--ink);box-shadow:none;border:2px dashed var(--soft)}
.btn:focus-visible,input:focus-visible{outline:4px solid var(--orange);outline-offset:2px}
.card{background:var(--card);border-radius:28px;padding:16px;margin:12px 0}
.big{font-size:96px;line-height:1.1}
svg.robot{width:62%;max-width:240px;height:auto}
.note{background:var(--orange);color:#fff;border-radius:20px;padding:10px 14px;font-size:20px;font-weight:700}
video{width:100%;border-radius:24px;background:#000;aspect-ratio:1;object-fit:cover}
.qr{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border-radius:20px;padding:10px;margin:10px 0;break-inside:avoid}
.qr svg{width:120px;height:120px;flex:none;background:#fff;padding:4px;border-radius:8px}
.qr b{font-size:20px}
input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:14px;border:2px solid var(--soft);background:var(--card);color:var(--ink)}
.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:24px;border:6px solid var(--card);margin:8px 0}
.sheet{background:#fff;color:#000;border-radius:16px;padding:12px;margin:12px 0;page-break-after:always}
.sheet h2{font-size:18px;margin:0 0 8px}
.pcs{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-end}
.pcs figure{margin:0}.pcs figcaption{font-size:22px;font-weight:700}
select{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:14px;border:2px solid var(--soft);background:var(--card);color:var(--ink);margin-bottom:8px}
svg.robot{animation:bob 2.4s ease-in-out infinite}
svg.robot.dance{animation:dance .9s ease-in-out infinite}
svg.robot.jump{animation:jump .7s ease-out 2}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.ant,.chest{transform-box:fill-box;transform-origin:center;animation:glow 1.4s ease-in-out infinite}
.wig{animation:wig 2s ease-in-out infinite}
.btn.go{animation:pulse 2.2s ease-in-out infinite}.btn.go:active{animation:none}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.cf i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes dance{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-14px)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-34px) scale(.95,1.05)}60%{transform:translateY(0) scale(1.08,.92)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes glow{50%{transform:scale(1.3)}}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#app.in{animation:fin .35s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

function pickVoice(){var l=ruVoices();if(!l.length)return null;var f=l.filter(function(v){return v.name==VN})[0];if(f)return f;var m=l.filter(function(v){return QD[Q].v.pref.test(v.name)});if(m.length)return m[0];return l[0]}
try{speechSynthesis.onvoiceschanged=function(){VOICE=pickVoice()}}catch(e){}
function setVoice(n){VN=n;VOICE=null;try{localStorage.setItem("rq_voice_"+Q,n)}catch(e){}}
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;QD[Q].v.f.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),s=t+i*.09;o.type=QD[Q].v.w;o.frequency.value=f;g.gain.setValueAtTime(.05,s);g.gain.exponentialRampToValueAtTime(.001,s+.08);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.09)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();beep();var v=VOICE||(VOICE=pickVoice());String(t).split(/[.!?]+\s*/).filter(Boolean).forEach(function(s){var u=new SpeechSynthesisUtterance(s);if(v)u.voice=v;u.lang="ru-RU";u.rate=QD[Q].v.r;u.pitch=QD[Q].v.p;u.volume=1;speechSynthesis.speak(u)})}catch(e){}}
var AUD={robot:{}},AU=null;
function play(k,txt){var u=(AUD[Q]||{})[k];if(!u)return say(txt);try{speechSynthesis.cancel()}catch(e){}try{if(AU)AU.pause();AU=new Audio(u);var r=AU.play();if(r&&r.catch)r.catch(function(){say(txt)})}catch(e){say(txt)}}
function playTask(){play("task"+(step+1),LV[step].t)}
function sayHint(){if(NM[step]||PH[step]||note)return say((note?note+" ":"")+hintSay());play("hint"+(step+1),hintSay())}
function sayWin(){var t=QD[Q].win.replace(/[^\u0400-\u04FFA-Za-z0-9!.,? ]/g,"").trim()+" "+finalText();if(prize||PH[N])return say(t);play("win",t)}

   +'<button class="btn small" onclick="go(\'parent\')">Для родителей</button>';
 },
 scan:function(){return '<h1>Покажи код 📷</h1><label class="btn small">📸 Снять код на фото<input type="file" accept="image/*" capture="environment" hidden onchange="snapQR(this)"></label><video id="v" playsinline muted></video><p id="err"></p><canvas id="cv" hidden></canvas><button class="btn alt" onclick="stopScan();go(\'home\')">Назад</button>'},

  var h='<h1>Подготовка квеста «Собери Бипика»</h1><p>Один квест — один робот. Других тематик в приложении больше нет.</p>'+photoSection()+'<h1>2. Печать кодов</h1><p>Распечатайте и спрячьте каждый код в своём месте, на уровне глаз ребёнка. Рядом с кодом положите бумажную деталь с тем же номером.</p><button class="btn noprint" onclick="window.print()">🖨️ Печать кодов</button><button class="btn alt noprint" onclick="go(\'sheet\')">🖍️ Раскраска на бумаге</button>';
  LV.forEach(function(L,i){h+='<div class="qr">'+qrSvg(QD[Q].qr+(i+1))+'<div><b>Код '+(i+1)+'</b><br>Спрятать: '+esc(pname(i))+'<br>Деталь: '+L.part+'</div></div>'});

   +'<button class="btn go noprint" onclick="prize=document.getElementById(\'pz\').value;save();go(\'home\')">Сохранить</button>'

 }

function render(){Q="robot";var a=document.getElementById("app");a.innerHTML=hdr()+V[view]();a.classList.remove("in");void a.offsetWidth;a.classList.add("in");var nv=document.getElementById("nav");if(nv)nv.innerHTML=navHtml();if(view==="home"&&step<N&&PH[step])initHintTicket();window.scrollTo(0,0)}
function initHintTicket(){var c=document.getElementById("hintTicketCanvas"),frame=document.getElementById("hintTicket");if(!c||!frame)return;var r=frame.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);if(!r.width||!r.height)return;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.style.width=r.width+"px";c.style.height=r.height+"px";var x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);var g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,"#e7d6a9");g.addColorStop(.5,"#c6b681");g.addColorStop(1,"#f1e4c4");x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.fillStyle="#5e5135";x.font="800 17px system-ui";x.textAlign="center";x.fillText("СОТРИ И УЗНАЙ",r.width/2,r.height/2-4);x.font="30px system-ui";x.fillText("✨",r.width/2,r.height/2+34);for(var i=0;i<75;i++){x.fillStyle=i%2?"#fff9d6aa":"#655d4388";x.beginPath();x.arc((i*43)%r.width,(i*71)%r.height,(i%3)+.5,0,Math.PI*2);x.fill()}var erased=false;function erase(e){if(erased)return;var b=c.getBoundingClientRect();x.save();x.globalCompositeOperation="destination-out";x.beginPath();x.arc(e.clientX-b.left,e.clientY-b.top,22,0,Math.PI*2);x.fill();x.restore();check()}function check(){if(erased)return;var d=x.getImageData(0,0,c.width,c.height).data,clear=0,total=0;for(var p=3;p<d.length;p+=256){total++;if(d[p]<100)clear++}if(total&&clear/total>.3){erased=true;frame.classList.add("open");c.style.opacity=".1";var label=document.getElementById("ticketInstruction");if(label)label.textContent="✅ Фото открыто! Запомни место и найди QR-код № "+(step+1)+"."}}c.onpointerdown=function(e){e.preventDefault();if(c.setPointerCapture)c.setPointerCapture(e.pointerId);erase(e)};c.onpointermove=function(e){if(e.buttons===0&&e.pointerType!=="touch")return;e.preventDefault();erase(e)};c.onpointerup=check}
function go(v,fn){if(fn)fn();view=v;render();if(v=="home"&&step<N)sayHint()}
function reset(){step=0;note="";save()}
function found(n){stopScan();if(n==step+1){note="";view="task";render();playTask()}
 else if(n<=step){note="Эта деталь уже есть!";view="home";render();say(note)}
 else{note="Рано! Сначала найди: "+pname(step);view="home";render();say(note)}}
function done(){step++;save();note="";confetti();if(step>=N){view="home";render();sayWin()}else{view="win";render();play("praise","Молодец! Забери деталь рядом с кодом!")}}

 try{navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){stream=s;v.srcObject=s;return v.play()}).then(tick).catch(scanErr)}catch(e){scanErr(e)}}
function decodeImg(im){var S=[1200,800,500];for(var i=0;i<S.length;i++){var k=Math.min(1,S[i]/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);var x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);var d=x.getImageData(0,0,c.width,c.height);var r=jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"});if(r)return r}return null}
function snapQR(inp){var f=inp.files&&inp.files[0];if(!f)return;var im=new Image(),u=URL.createObjectURL(f);
 function bad(){var e=document.getElementById("err");if(e)e.innerHTML="Не вижу код. Подойди ближе и сфотографируй ещё раз 📸";say("Не вижу код. Подойди ближе и сфотографируй ещё раз.")}
 im.onload=function(){var r=null;try{r=decodeImg(im)}catch(e){}URL.revokeObjectURL(u);inp.value="";
  if(r){var m=new RegExp("^"+QD[Q].qr+"(\\d+)$").exec(r.data);if(m){stopScan();found(+m[1]);return}}bad()};
 im.onerror=bad;im.src=u}
function openFull(){var w=null;try{w=window.open(location.href,"_blank")}catch(e){}if(!w){try{window.top.location.href=location.href}catch(e){var x=document.getElementById("err");if(x)x.innerHTML+="<br>Не удалось открыть."}}}
function scanErr(e){var x=document.getElementById("err");if(x)x.innerHTML="Камера не открылась"+(e&&e.name?" ("+esc(e.name)+")":"")+".<br><button class='btn alt' onclick='openFull()'>🔓 Открыть без рамки</button><small>"+esc(location.href.slice(0,70))+"</small>";var vv=document.getElementById("v");if(vv)vv.style.display="none"}
function tick(){var v=document.getElementById("v"),c=document.getElementById("cv");if(!v||!c)return;
 if(v.readyState>=2&&v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;var x=c.getContext("2d");x.drawImage(v,0,0);var d=x.getImageData(0,0,c.width,c.height);var r=jsQR(d.data,d.width,d.height);
  if(r){var m=new RegExp("^"+QD[Q].qr+"(\\d+)$").exec(r.data);if(m){found(+m[1]);return}}}
