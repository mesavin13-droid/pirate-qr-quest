 if(state.step>=5)return '<section class="screen"><div class="hero"><div class="eyebrow">МИССИЯ ВЫПОЛНЕНА</div><h1>Бипик снова работает!</h1><p>Слава и Денис, вы нашли все пять деталей и собрали робота.</p><div class="robot-stage">'+robotSvg(5,false,"0 0 552 828","final-hero")+'</div>'+progressBars()+'</div><div class="card"><div class="clue-head"><div class="clue-icon">🎁</div><div><div class="clue-title">Финальная подсказка</div><div class="place-name">Найди приз!</div></div></div>'+(state.photos[5]?'<div class="ticket" id="prizeTicket"><img src="'+state.photos[5]+'" alt="Место приза"><canvas id="prizeCanvas"></canvas></div><div class="ticket-note" id="prizeStatus">Сотри защитный слой, чтобы узнать место приза.</div>':'<p>'+esc(state.prizeText||"Приз спрятан в особом месте. Спроси у взрослого, где искать!")+'</p>')+'<button class="btn yellow" onclick="say('+JSON.stringify(state.prizeText||"Бипик ждёт тебя у приза!")+')">🔊 Послушать финал</button><button class="btn soft" onclick="resetQuest()">Начать заново</button></div></section>';
 const l=LEVELS[state.step];
 const hintPhoto=state.step>0?state.photos[state.step-1]:"";
 return '<section class="screen"><div class="hero"><div class="eyebrow">МИССИЯ: ПОЧИНИТЬ РОБОТА</div><h1>Собери Бипика!</h1><p>Слава и Денис, помогите мне найти пять деталей. Сканируй код, забирай часть и приклеивай по номеру.</p><div class="robot-stage">'+robotSvg(state.step,false,"0 0 552 828","hero-robot")+'</div>'+progressBars()+'</div><div class="card progress-card"><div><div class="progress-num">'+state.step+' / 5<small>ДЕТАЛЕЙ НАЙДЕНО</small></div></div><span class="status">'+(state.step===0?"МИССИЯ НАЧИНАЕТСЯ":"ОТЛИЧНАЯ РАБОТА!")+'</span></div><div class="card"><div class="clue-head"><div class="clue-icon">🔎</div><div><div class="clue-title">Подсказка робота</div><div class="place-name">'+esc(state.places[state.step]||l.place)+'</div></div></div>'+(hintPhoto?'<div class="ticket" id="placeTicket"><img src="'+hintPhoto+'" alt="Скрытая фотография следующего места"><canvas id="placeCanvas"></canvas></div><div class="ticket-note" id="placeStatus">✨ Сотри билет, чтобы узнать место следующего QR-кода.</div>':'<p>'+esc(l.intro)+'</p>')+'<div class="callout">Найди QR-код № '+(state.step+1)+' и выполни задание. После него Бипик покажет подсказку к следующему месту. Полученную деталь вклей в клетку с таким же номером.</div></div><button class="btn primary" onclick="startScan()">📷 Сканировать QR-код № '+(state.step+1)+'</button><button class="btn soft" onclick="sayHint()">🔊 Послушать подсказку</button></section>';
}
function scanHtml(){return '<section class="screen"><div class="card"><button class="btn ghost small" onclick="goHome()">← Назад к Бипику</button><div class="task-icon">📷</div><h2 style="text-align:center">Найди QR-код № '+(Math.min(state.step+1,5))+'</h2><p>Наведи камеру на карточку. Откроется только правильный код следующего этапа.</p><video id="scannerVideo" playsinline muted></video><canvas id="scanCanvas" class="hidden"></canvas><div id="qrError" class="hidden"></div><label class="btn soft">📸 Не включается камера? Выбрать фото QR-кода<input class="hidden" type="file" accept="image/*" capture="environment" onchange="scanFromPhoto(this)"></label><button class="btn ghost" onclick="stopCamera();goHome()">Отмена</button></div></section>'}
function taskHtml(){const l=LEVELS[state.step];return '<section class="screen"><div class="card"><div class="part-flag">🧩 ДЕТАЛЬ № '+(state.step+1)+' · '+esc(l.part.toUpperCase())+'</div><div class="task-icon">'+l.emoji+'</div><h2 style="text-align:center">'+esc(l.title)+'</h2><div class="task-box">'+esc(l.task)+'</div><button class="btn soft" onclick="say('+JSON.stringify(l.task)+')">🔊 Послушать задание</button><button class="btn yellow" onclick="completeTask()">Готово! Я выполнил ✅</button><p class="tiny">После выполнения забери бумажную деталь рядом с QR-кодом и приклей её на основу по номеру.</p></div></section>'}
function winHtml(){const n=state.step;return '<section class="screen"><div class="hero"><div class="eyebrow">ДЕТАЛЬ НАЙДЕНА</div><h1>Есть! Деталь № '+n+' 🎉</h1><p>'+esc(LEVELS[n-1].part)+'. Найди такую же цифру на листе-основе и приклей часть робота.</p><div class="robot-stage">'+robotSvg(n,false,"0 0 552 828","win-robot")+'</div>'+progressBars()+'</div><button class="btn primary" onclick="goHome()">'+(n===5?"Посмотреть финал 🎁":"К следующей подсказке →")+'</button><button class="btn soft" onclick="say('+JSON.stringify("Молодец! Забери деталь номер "+n+" и приклей её по номеру.")+')">🔊 Послушать</button></section>'}
function baseNumbers(){return '<div class="base-cell bc1"><span>1</span></div><div class="base-cell bc2"><span>2</span></div><div class="base-cell bc3"><span>3</span></div><div class="base-cell bc4"><span>4</span></div><div class="base-cell bc5"><span>5</span></div>'}
function pieceMarkup(i){const z=ZONES[i];return '<div class="piece-print '+(i===2?"mid":"")+'"><b>'+(i+1)+'</b>'+robotSvg(0,true,z[0]+' '+z[1]+' '+z[2]+' '+z[3],"piece-"+(i+1))+'</div>'}
function puzzleHtml(){return '<section class="screen"><div class="card no-print"><h2>Пазл Бипика для печати</h2><p>Два листа A4: основа и пять отдельных деталей. Рядом с каждым QR-кодом прячь часть с тем же номером.</p><button class="btn primary" onclick="window.print()">🖨️ Распечатать пазл</button><p class="tiny">При печати выбери A4 и масштаб 100%, без «Вписать в страницу».</p></div><div class="print-page"><div class="print-title">Лист 1 из 2 · Основа пазла</div><h2>Собери Бипика!</h2><p class="print-note">Вклей каждую найденную деталь в клетку с таким же номером.</p><div class="base-board">'+robotSvg(0,true,"0 0 552 828","base-robot")+baseNumbers()+'</div><p class="print-instruction">Сканируй QR-код, находи деталь и приклеивай её по номеру.</p></div><div class="print-page"><div class="print-title">Лист 2 из 2 · Пять деталей для вырезания</div><h2>Детали Бипика</h2><p class="print-note">Вырежи по пунктиру. Номер детали совпадает с номером QR-кода и клетки на основе.</p><div class="pieces-grid">'+ZONES.map((z,i)=>pieceMarkup(i)).join("")+'</div><p class="print-instruction">Прячь деталь рядом с QR-кодом того же номера. После задания ребёнок забирает её и клеит на основу.</p></div></section>'}
function parentHtml(){let fields=state.places.map((place,i)=>'<div class="field"><label>Где спрятан QR-код № '+(i+1)+' · деталь '+(i+1)+'</label><input value="'+esc(place)+'" placeholder="'+esc(LEVELS[i].place)+'" onchange="setPlace('+i+',this.value)">'+(i<4?'<label class="btn soft small">📸 Фото места следующей карточки № '+(i+2)+' — откроется после задания № '+(i+1)+'<input class="hidden" type="file" accept="image/*" capture="environment" onchange="loadPhoto('+i+',this)"></label>'+(state.photos[i]?'<img class="photo-preview" src="'+state.photos[i]+'" alt="Фото следующего места"><button class="btn ghost small" onclick="clearPhoto('+i+')">Удалить фото</button>':''):'<p class="tiny">Подсказку к финальному месту добавь в поле «Фото места приза» ниже.</p>')+'</div>').join("");
 fields+='<div class="field"><label>Место, где спрятан приз</label><input value="'+esc(state.prizeText)+'" placeholder="Например: в коробке с кубиками" onchange="setPrizeText(this.value)"><label class="btn soft small">📸 Фото места приза<input class="hidden" type="file" accept="image/*" capture="environment" onchange="loadPhoto(5,this)"></label>'+(state.photos[5]?'<img class="photo-preview" src="'+state.photos[5]+'" alt="Фото приза"><button class="btn ghost small" onclick="clearPhoto(5)">Удалить фото</button>':'')+'</div>';
 return '<section class="screen" id="parentScreen"><div id="parentEditor"><div class="card"><h2>Подготовка квеста</h2><p>Печать, QR-коды и пазл робота Бипика. Приложение хранит настройки на этом телефоне.</p><div class="callout">Распечатай 5 QR-карточек и пазл. Прячь каждый код вместе с деталью того же номера. Ребёнок не сможет перейти дальше, пока не отсканирует правильный QR.</div>'+fields+'<button class="btn primary" onclick="saveState();goHome()">Сохранить настройки</button><button class="btn soft" onclick="showPuzzle()">🧩 Печать пазла</button><button class="btn soft" onclick="printCodes()">🖨️ Распечатать все QR-коды</button><button class="btn ghost" onclick="resetQuest()">Сбросить прогресс</button></div></div><div id="qrSection" class="card"><h2>QR-карточки для печати</h2><p>Каждый код открывает одну конкретную деталь.</p><div id="qrList"></div></div></section>'}
function renderQrCodes(){
 const host=document.getElementById("qrList");if(!host)return;
 host.innerHTML=LEVELS.map((l,i)=>'<div class="qr-card"><div class="qr-image" id="qr-'+i+'"></div><div class="qr-copy"><b>QR-код '+(i+1)+' · Деталь '+(i+1)+'</b><p>'+esc(l.title)+'</p><p>Место: '+esc(state.places[i]||l.place)+'</p><p>Часть пазла: '+esc(l.part)+'</p><span class="tiny">Код: BIPIK-QR-'+(i+1)+'</span></div></div>').join("");
 if(!window.QRCode){host.insertAdjacentHTML("afterbegin",'<div id="qrError">Библиотека QR не загрузилась. Проверь интернет и открой настройки снова.</div>');return}
 LEVELS.forEach((l,i)=>new QRCode(document.getElementById("qr-"+i),{text:"BIPIK-QR-"+(i+1),width:150,height:150,colorDark:"#142b4e",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}));
}
function printCodes(){document.body.classList.add("printing-codes");window.print();window.onafterprint=function(){document.body.classList.remove("printing-codes")}}
function saveState(){try{localStorage.setItem("bipik_quest_v1",JSON.stringify(state))}catch(e){alert("Телефону не хватило памяти. Удали несколько больших фотографий и попробуй снова.")}}
function setPlace(i,v){state.places[i]=v.trim();saveState()}
function setPrizeText(v){state.prizeText=v.trim();saveState()}
function loadPhoto(i,input){const f=input.files&&input.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=function(){const scale=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);state.photos[i]=c.toDataURL("image/jpeg",.68);URL.revokeObjectURL(url);saveState();render()};im.onerror=function(){URL.revokeObjectURL(url);alert("Не удалось открыть фото. Попробуй JPG или PNG.")};im.src=url}
function clearPhoto(i){state.photos[i]="";saveState();render()}
function resetQuest(){if(!confirm("Начать квест сначала? Прогресс обнулится, фотографии и места останутся."))return;state.step=0;saveState();goHome()}
function goHome(){stopCamera();view="home";render()}
function showPuzzle(){stopCamera();view="puzzle";render()}
function openParent(){stopCamera();view="parent";render()}
function startScan(){if(state.step>=5)return;stopCamera();view="scan";render();const video=document.getElementById("scannerVideo");const err=document.getElementById("qrError");if(!window.jsQR){showQrError("Сканер не загрузился. Проверь подключение к интернету.");return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showQrError("Браузер не разрешил камеру. Используй кнопку «Выбрать фото QR-кода».");return}navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(stream=>{cameraStream=stream;video.srcObject=stream;video.play();scanLoop()}).catch(e=>showQrError("Не получилось включить камеру. Разреши доступ в настройках браузера или выбери фото QR-кода."))}
function showQrError(t){const e=document.getElementById("qrError");if(e){e.textContent=t;e.classList.remove("hidden")}}
function scanLoop(){const v=document.getElementById("scannerVideo");if(!v||view!=="scan"||!cameraStream)return;if(v.readyState>=2&&v.videoWidth){const c=document.getElementById("scanCanvas");c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext("2d");x.drawImage(v,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),r=window.jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"});if(r){acceptCode(r.data);return}}scanFrame=requestAnimationFrame(scanLoop)}
function scanFromPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=function(){try{const w=1200/Math.max(im.width,im.height),c=document.createElement("canvas");c.width=Math.round(im.width*Math.min(1,w));c.height=Math.round(im.height*Math.min(1,w));const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),r=window.jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"});URL.revokeObjectURL(u);inp.value="";if(r)acceptCode(r.data);else showQrError("Не вижу QR-код на фото. Подойди ближе и попробуй ещё раз.")}catch(e){URL.revokeObjectURL(u);showQrError("Не удалось прочитать фото QR-кода.")}};im.onerror=function(){URL.revokeObjectURL(u);showQrError("Не удалось открыть фото.")};im.src=u}
function acceptCode(code){const m=/^BIPIK-QR-(\d)$/.exec(String(code).trim());if(!m){showQrError("Это не карточка квеста Бипика. Найди QR-код с номером детали.");return}const n=Number(m[1]);if(n<=state.step){showQrError("Эта деталь уже собрана. Ищи QR-код № "+(state.step+1)+".");return}if(n!==state.step+1){showQrError("Сначала нужна карточка № "+(state.step+1)+". Следующие QR-коды пока закрыты.");return}stopCamera();view="task";render()}
function stopCamera(){if(scanFrame)cancelAnimationFrame(scanFrame);scanFrame=0;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}const v=document.getElementById("scannerVideo");if(v){try{v.pause();v.srcObject=null}catch(e){}}}
function completeTask(){if(view!=="task"||state.step>=5)return;state.step++;saveState();view="win";render();say("Молодец! Забери деталь номер "+state.step+" и приклей её по номеру.")}
function say(text){try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang="ru-RU";u.rate=.88;u.pitch=1.08;speechSynthesis.speak(u)}catch(e){}}
function sayHint(){if(state.step>=5)return say(state.prizeText||"Бипик собран! Ищи свой приз.");const l=LEVELS[state.step];say((state.photos[state.step]?"Сотри билет, чтобы открыть фотографию места. ":"")+ "Бипик просит найти "+(state.places[state.step]||l.place)+". Когда найдёшь QR-код номер "+(state.step+1)+", отсканируй его.")}
let ticketDone={};
function initScratch(ticketId,canvasId,statusId,num){const frame=document.getElementById(ticketId),c=document.getElementById(canvasId);if(!frame||!c||ticketDone[ticketId])return;const img=frame.querySelector("img");if(!img)return;const setup=function(){const r=frame.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);if(!r.width||!r.height)return;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.style.width=r.width+"px";c.style.height=r.height+"px";const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);const g=x.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,"#eadbb5");g.addColorStop(.5,"#c4b284");g.addColorStop(1,"#f6e7c6");x.fillStyle=g;x.fillRect(0,0,r.width,r.height);x.fillStyle="#5d5137";x.textAlign="center";x.font="900 17px system-ui";x.fillText("СОТРИ И УЗНАЙ",r.width/2,r.height/2-4);x.font="30px system-ui";x.fillText("✨",r.width/2,r.height/2+34);for(let i=0;i<85;i++){x.fillStyle=i%2?"#fff9d6aa":"#655d4388";x.beginPath();x.arc((i*47)%r.width,(i*73)%r.height,(i%3)+.5,0,Math.PI*2);x.fill()}let erased=false;function erase(e){if(erased)return;const b=c.getBoundingClientRect();x.save();x.globalCompositeOperation="destination-out";x.beginPath();x.arc(e.clientX-b.left,e.clientY-b.top,22,0,Math.PI*2);x.fill();x.restore();check()}function check(){if(erased)return;const d=x.getImageData(0,0,c.width,c.height).data;let clear=0,total=0;for(let p=3;p<d.length;p+=256){total++;if(d[p]<100)clear++}if(total&&clear/total>.3){erased=true;ticketDone[ticketId]=true;frame.classList.add("open");c.style.opacity=".06";const note=document.getElementById(statusId);if(note)note.textContent=typeof num==="number"?"✅ Фото открыто! Запомни место и найди QR-код № "+num+".":"✅ Фото открыто! Иди к этому месту вместе со взрослым — там спрятан приз."}}c.onpointerdown=e=>{e.preventDefault();if(c.setPointerCapture)c.setPointerCapture(e.pointerId);erase(e)};c.onpointermove=e=>{if(e.buttons===0&&e.pointerType!=="touch")return;e.preventDefault();erase(e)};c.onpointerup=check};if(img.complete&&img.naturalWidth)setup();else img.onload=setup}
function loadState(){try{const saved=JSON.parse(localStorage.getItem("bipik_quest_v1")||"null");if(saved&&Array.isArray(saved.places)&&Array.isArray(saved.photos))return{step:Math.max(0,Math.min(5,Number(saved.step)||0)),places:LEVELS.map((l,i)=>String(saved.places[i]||l.place)),photos:Array.from({length:6},(_,i)=>saved.photos[i]||""),prizeText:String(saved.prizeText||"")}}catch(e){}return{step:0,places:LEVELS.map(l=>l.place),photos:Array(6).fill(""),prizeText:""}}
let state=loadState(),view="home",cameraStream=null,scanFrame=0;
render();
</script>
</body>
</html>
